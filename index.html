<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickWell — Produtos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #4B8190;
    --teal-dark: #3a6570;
    --teal-light: #e8f2f4;
    --cream: #ECEDDA;
    --text-dark: #1e3035;
    --text-light: #7a9ba3;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text-dark); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  header { background: var(--cream); padding: 10px 16px; position: sticky; top: 0; z-index: 100; transition: background 0.3s ease; border-bottom: 1px solid rgba(75,129,144,0.08); }
  header.scrolled { background: #2f464c; border-bottom-color: transparent; padding: 8px 16px; }

  .logo-default { display: block; }
  .logo-default svg { height: 40px; width: auto; display: block; }
  .logo-scrolled { display: none; }
  .logo-scrolled svg { height: 40px; width: auto; display: block; }
  header.scrolled .logo-default { display: none; }
  header.scrolled .logo-scrolled { display: block; }

  .tagline { font-size: 11px; color: rgba(47,70,76,0.5); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; transition: color 0.3s; }
  header.scrolled .tagline { color: rgba(236,237,218,0.6); }

  .filter-scroll-wrap { margin-top: 8px; }
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; border: 1px solid rgba(75,129,144,0.35); border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 400; background: transparent; color: var(--teal-dark); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap; letter-spacing: 0.01em; }
  .chip.active { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 500; }
  header.scrolled .chip { border-color: rgba(236,237,218,0.5); color: rgba(236,237,218,0.8); }
  header.scrolled .chip.active { background: rgba(236,237,218,0.2); color: var(--cream); border-color: var(--cream); }
  .filter-scroll { margin-top: 14px; margin-bottom: 4px; }

  .count-bar { padding: 10px 16px 0; font-size: 12px; color: var(--text-light); }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; padding: 10px 12px 32px; }

  .card { background: var(--white); border-radius: 12px; border: 1px solid rgba(0,0,0,0.07); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s; }
  .card:active { transform: scale(0.98); }

  .card-img-wrap { width: 100%; height: 100px; background: #f5f5f0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
  .img-placeholder { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }

  .card-body { padding: 12px 12px 14px; display: flex; flex-direction: column; flex: 1; }
  .card-brand { font-size: 10px; color: var(--text-light); font-weight: 400; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; display: block; }
  .card-name { font-size: 13px; font-weight: 600; color: var(--text-dark); line-height: 1.35; height: 36px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 4px 0; }

  .cat-badge { display: block; font-size: 10px; padding: 0; font-weight: 400; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-light); height: 14px; overflow: hidden; }
  
  .nutrient-wrap { margin-top: auto; padding-top: 8px; }
  .nutrients { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
  .nut { background: #f2f2ec; border: none; border-radius: 6px; padding: 6px 4px; text-align: center; }
  .nut-val { display: block; font-size: 12px; font-weight: 600; color: var(--text-dark); line-height: 1.2; }
  .nut-label { display: block; font-size: 9px; color: var(--text-light); margin-top: 2px; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; min-height: 22px; }
  .kcal-row { display: flex; align-items: baseline; gap: 3px; }
  .kcal-val { font-size: 14px; font-weight: 700; color: var(--teal); }
  .kcal-label { font-size: 11px; color: var(--text-light); }
  .pvp { font-size: 15px; font-weight: 700; color: var(--text-dark); font-family: 'DM Serif Display', serif; margin-left: auto; }

  .empty, .loading { grid-column: 1/-1; text-align: center; padding: 48px 20px; color: var(--text-light); font-size: 14px; }
  .error { grid-column: 1/-1; text-align: center; padding: 48px 20px; color: #c0392b; font-size: 13px; }

  footer { text-align: center; padding: 16px; font-size: 11px; color: var(--text-light); border-top: 1px solid rgba(75,129,144,0.1); font-style: italic; }
</style>
</head>

    <div class="tagline" id="local"></div>

</header>

<div class="count-bar" id="count"></div>

<div class="grid" id="grid">
  <div class="loading">A carregar produtos...</div>
</div>

<footer>Escolhe bem. Vive Melhor!</footer>

<script>
/* =====================================================================
   CONFIGURAÇÃO — a única parte que alguma vez precisas de editar.
   Cola aqui os links CSV de cada aba (Ficheiro → Partilhar → Publicar na web).
   ===================================================================== */
const CONFIG = {
  CATALOGO: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvoDymjNn3N35xwnLOezVPj3bYW1v3E1Ohb3L4PQ8TLQ1OVgHkjmhf1Pa3jv-X_C75UVmgv9fUT9_G/pub?gid=974877580&single=true&output=csv",
  MAQUINAS: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvoDymjNn3N35xwnLOezVPj3bYW1v3E1Ohb3L4PQ8TLQ1OVgHkjmhf1Pa3jv-X_C75UVmgv9fUT9_G/pub?gid=902229626&single=true&output=csv",
  SORTIDO:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvoDymjNn3N35xwnLOezVPj3bYW1v3E1Ohb3L4PQ8TLQ1OVgHkjmhf1Pa3jv-X_C75UVmgv9fUT9_G/pub?gid=1150092929&single=true&output=csv",
  PRECOS:   "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvoDymjNn3N35xwnLOezVPj3bYW1v3E1Ohb3L4PQ8TLQ1OVgHkjmhf1Pa3jv-X_C75UVmgv9fUT9_G/pub?gid=278017187&single=true&output=csv",
  PASTA_IMAGENS: "https://pickwell-web.github.io/pickwell_produtos/img/",
  MAQUINA_PADRAO: "M01"   // usada quando o link não traz ?m=
};

/* ---------- Leitura do CSV (aguenta vírgulas, aspas e quebras de linha nas células) ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], cur = "", inQ = false;
  text = String(text).replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  const headers = (rows.shift() || []).map(h => h.trim());
  return rows
    .map(r => {
      const o = {};
      headers.forEach((h, i) => { if (h) o[h] = (r[i] || "").replace(/\s+/g, " ").trim(); });
      return o;
    })
    .filter(o => Object.values(o).some(v => v !== ""));
}

/* ---------- Ajudas ---------- */
// "Máquina " → "maquina" (sem acentos, minúsculas) para comparar sem stress
function norm(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}
// Valor de uma coluna pelo início do nome: get(linha, "kcal") apanha "Kcal por dose"
function get(row, name) {
  const k = Object.keys(row).find(k => norm(k).startsWith(norm(name)));
  return k ? row[k] : "";
}
// "26,3" / "1.40€" / "215" → número; "Ir à loja" ou vazio → null
function num(v) {
  if (v === undefined || v === null) return null;
  const c = String(v).replace("€", "").replace(",", ".").trim();
  return /^-?\d+(\.\d+)?$/.test(c) ? parseFloat(c) : null;
}
function grams(n) { return n === null ? "—" : n.toFixed(1).replace(".", ",") + "g"; }
function euro(n)  { return n === null ? "" : n.toFixed(2).replace(".", ",") + " €"; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- Lógica: junta as 4 abas e devolve os produtos de uma máquina ---------- */
function buildMachine(catalogo, maquinas, sortido, precos, codigo) {
  const m = norm(codigo);
  if (!m) return { msg: "Lê o QR code na máquina para veres os produtos disponíveis." };

  const maq = maquinas.find(r => norm(get(r, "maquina")) === m);
  if (!maq) return { msg: "Esta máquina não está registada. Confirma se leste o QR code certo." };
  if (norm(get(maq, "ativa")) !== "sim") return { msg: "Esta máquina está temporariamente indisponível." };

  // Coluna da máquina na aba Sortido (ex.: "M01")
  const colKey = sortido.length ? Object.keys(sortido[0]).find(k => norm(k) === m) : null;
  if (!colKey) return { local: get(maq, "local"), msg: "Ainda não há produtos configurados para esta máquina." };

  const naMaquina = new Set(
    sortido.filter(r => norm(r[colKey]) === "sim").map(r => norm(get(r, "id")))
  );

  const especiais = {};
  precos.forEach(r => {
    if (norm(get(r, "maquina")) === m) especiais[norm(get(r, "id"))] = num(get(r, "pvp"));
  });

  const produtos = catalogo
    .filter(r => {
      const id = norm(get(r, "id"));
      return id && naMaquina.has(id) && norm(get(r, "ativo")) !== "nao";
    })
    .map(r => {
      const id = norm(get(r, "id"));
      const pEsp = especiais[id];
      return {
        id,
        img: get(r, "id").trim().toLowerCase(),
        nome: get(r, "produto"),
        marca: get(r, "marca"),
        cat: get(r, "categoria"),
        kcal: num(get(r, "kcal")),
        prot: num(get(r, "proteina")),
        hidr: num(get(r, "hidratos")),
        fibra: num(get(r, "fibra")),
        pvp: (pEsp !== undefined && pEsp !== null) ? pEsp : num(get(r, "pvp"))
      };
    });

  if (!produtos.length) return { local: get(maq, "local"), msg: "De momento não há produtos disponíveis nesta máquina." };
  return { local: get(maq, "local"), produtos };
}

/* ---------- Interface ---------- */
let allProducts = [];
let activeFilter = "todos";

function showMessage(text) {
  document.getElementById("count").textContent = "";
  document.getElementById("filters").innerHTML = "";
  document.getElementById("grid").innerHTML = `<div class="empty">${esc(text)}</div>`;
}

// Tenta .webp; se não existir tenta .png; se falhar mostra o ícone cinzento
function imgFallback(img) {
  if (!img.dataset.tried) { img.dataset.tried = "1"; img.src = img.src.replace(/\.webp$/, ".png"); }
  else { img.style.display = "none"; img.nextElementSibling.style.display = "flex"; }
}

function buildFilters(products) {
  const cats = [...new Set(products.map(p => p.cat).filter(Boolean))];
  const bar = document.getElementById("filters");
  bar.innerHTML = '<button class="chip active" data-cat="todos">Todos</button>';
  cats.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.dataset.cat = cat;
    btn.textContent = cat;
    bar.appendChild(btn);
  });
  bar.onclick = e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    bar.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.cat;
    renderGrid();
  };
}

function renderGrid() {
  const list = activeFilter === "todos" ? allProducts : allProducts.filter(p => p.cat === activeFilter);
  document.getElementById("count").textContent = list.length + " produto" + (list.length !== 1 ? "s" : "");
  document.getElementById("grid").innerHTML = list.map(p => `
      <div class="card">
        <div class="card-img-wrap">
          <img src="${CONFIG.PASTA_IMAGENS}${encodeURIComponent(p.img)}.webp" alt="${esc(p.nome)}" loading="lazy" onerror="imgFallback(this)">
          <div class="img-placeholder" style="display:none">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#b8c8cc" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>
        </div>
        <div class="card-body">
          <span class="card-brand">${esc(p.marca)}</span>
          <span class="card-name">${esc(p.nome)}</span>
          <span class="cat-badge">${esc(p.cat)}</span>
          <div class="nutrient-wrap">
            <div class="nutrients">
              <div class="nut"><span class="nut-val">${grams(p.prot)}</span><span class="nut-label">Proteína</span></div>
              <div class="nut"><span class="nut-val">${grams(p.hidr)}</span><span class="nut-label">Hidratos</span></div>
              <div class="nut"><span class="nut-val">${grams(p.fibra)}</span><span class="nut-label">Fibra</span></div>
            </div>
          </div>
          <div class="card-footer">
            ${p.kcal !== null ? `<div class="kcal-row"><span class="kcal-val">${Math.round(p.kcal)}</span><span class="kcal-label"> kcal/dose</span></div>` : ""}
            <span class="pvp">${euro(p.pvp)}</span>
          </div>
        </div>
      </div>`).join("");
}

async function fetchCSV(url, optional) {
  if (!url || url.startsWith("COLAR_AQUI")) {
    if (optional) return [];
    throw new Error("Link CSV em falta");
  }
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return parseCSV(await res.text());
  } catch (e) {
    if (optional) return [];
    throw e;
  }
}

async function init() {
  const codigo = (new URLSearchParams(location.search).get("m") || CONFIG.MAQUINA_PADRAO || "").trim();
  if (!codigo) { showMessage("Lê o QR code na máquina para veres os produtos disponíveis."); return; }
  try {
    const [catalogo, maquinas, sortido, precos] = await Promise.all([
      fetchCSV(CONFIG.CATALOGO), fetchCSV(CONFIG.MAQUINAS),
      fetchCSV(CONFIG.SORTIDO), fetchCSV(CONFIG.PRECOS, true)
    ]);
    const r = buildMachine(catalogo, maquinas, sortido, precos, codigo);
    if (r.local) document.getElementById("local").textContent = r.local;
    if (r.msg) { showMessage(r.msg); return; }
    allProducts = r.produtos;
    buildFilters(allProducts);
    renderGrid();
  } catch (err) {
    showMessage("Não foi possível carregar os produtos. Verifica a ligação à internet e volta a tentar.");
  }
}

if (typeof window !== "undefined") {
  init();
  window.addEventListener("scroll", () => {
    document.querySelector("header").classList.toggle("scrolled", window.scrollY > 10);
  });
}
</script>
